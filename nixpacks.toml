# nixpacks.toml — Railway build config for Al-Motafawiq Bot (Puppeteer + Chromium)

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "freetype",
  "freetype.dev",
  "harfbuzz",
  "cacert",
  "ttf-opensans",
  "fontconfig"
]

[phases.install]
cmds = [
  "npm ci --omit=dev"
]

[phases.build]
cmds = []

[start]
cmd = "node index.js"
